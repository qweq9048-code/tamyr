<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тамыр · Продукты с доставкой</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6ef;--card:#fff;--ink:#16261c;--mute:#5d6d62;--line:#dbe4d6;--accent:#e4492f;--accent-ink:#fff;--ok:#2f7d4f;--sun:#f6c744;--sun-ink:#2a2200;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#192a20;--ink:#eaf3e8;--mute:#9db1a2;--line:#27402f;--ok:#6cc58f}}
:root[data-theme="dark"]{--bg:#101a14;--card:#192a20;--ink:#eaf3e8;--mute:#9db1a2;--line:#27402f;--ok:#6cc58f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:10px;align-items:center}
.logo{font:800 20px Unbounded,sans-serif;letter-spacing:-.02em;margin-right:auto}
.logo span{color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500}
.cartbtn{background:var(--sun);color:var(--sun-ink);border-color:transparent;font-weight:700}
main{max-width:1100px;margin:auto;padding:16px}
h1{font:800 clamp(26px,5vw,44px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;margin:12px 0 6px;max-width:16ch}
.sub{color:var(--mute);margin:0 0 18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1 1 220px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;border-radius:99px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.p .e{font-size:54px;line-height:1;margin-bottom:6px}
.p h3{margin:0;font-size:17px}
.price{font-weight:700;font-size:18px}
.price small{color:var(--mute);font-weight:400}
.st{font-size:13px;color:var(--ok)}
.st.no{color:var(--accent)}
.add{margin-top:8px;border:0;border-radius:10px;padding:10px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.add:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
.qty{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.empty{color:var(--mute);padding:30px 0}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:8}
#shade.open{display:block}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:9;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cart.open{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font:800 18px Unbounded,sans-serif}
.cb{flex:1;overflow:auto;padding:12px 16px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1}
.row .n small{display:block;color:var(--mute)}
.sum{padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .tot{font-weight:800;font-size:20px}
form{display:grid;gap:8px;margin-top:14px}
form input{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;width:100%}
.pay{display:flex;gap:8px}
.pay label{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;text-align:center;cursor:pointer}
.pay input{position:absolute;opacity:0;width:1px;height:1px}
.pay label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.go{border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;cursor:pointer}
.ok{text-align:center;padding:40px 10px}
.ok b{font:800 22px Unbounded,sans-serif;display:block;margin:10px 0}
.err{color:var(--accent);font-size:14px;min-height:1em}
@media (prefers-reduced-motion:reduce){#cart{transition:none}}
</style>
</head>
<body>
<header><div class="bar">
<div class="logo">Тамыр<span>.</span></div>
<button class="pill" id="lang" aria-label="Тил / Язык">RU</button>
<button class="pill cartbtn" id="open"></button>
</div></header>

<main>
<h1 id="h1"></h1>
<p class="sub" id="sub"></p>
<div class="tools"><input class="search" id="q" type="search"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</main>

<div id="shade"></div>
<aside id="cart" aria-label="Cart">
<div class="ch"><h2 id="ct"></h2><button class="pill" id="close">✕</button></div>
<div class="cb" id="cb"></div>
<div class="sum" id="sum"></div>
</aside>

<script>
const WEBHOOK_URL="https://namyr.app.n8n.cloud/webhook/zakaz"; // n8n Webhook URL ушул жерге коюлат
const FREE_FROM=1000, FEE=150;
const T={
 ky:{h1:"Азык-түлүк үйүңүзгө чейин",sub:"Тандаңыз, баасын көрүңүз, төлөңүз. Курьер алып келет.",q:"Товар издөө",all:"Баары",add:"Себетке",out:"Жок",inst:"Бар: ",cart:"Себет",empty:"Себет бош. Товар кошуңуз.",items:"Товарлар",deliv:"Жеткирүү",free:"Акысыз",total:"Жалпы",name:"Атыңыз",phone:"Телефон",addr:"Дарек (көчө, үй, батир)",cash:"Накталай",card:"Карта",order:"Буйрутма берүү",need:"Бардык талааларды толтуруңуз.",done:"Буйрутма кабыл алынды!",num:"Номер",soon:"Администратор жакында байланышат.",more:"Дагы буюрутма",unit:{kg:"кг",l:"л",pc:"даана"},cats:{fv:"Жашылча-жемиш",dairy:"Сүт азыктары",meat:"Эт",basic:"Нан жана дан",drink:"Суусундук"},som:"сом",min:"Акысыз жеткирүү "+FREE_FROM+" сомдон"},
 ru:{h1:"Продукты с доставкой до двери",sub:"Выберите, посмотрите цену, оплатите. Курьер привезёт.",q:"Поиск товара",all:"Все",add:"В корзину",out:"Нет в наличии",inst:"В наличии: ",cart:"Корзина",empty:"Корзина пуста. Добавьте товары.",items:"Товары",deliv:"Доставка",free:"Бесплатно",total:"Итого",name:"Ваше имя",phone:"Телефон",addr:"Адрес (улица, дом, кв.)",cash:"Наличными",card:"Картой",order:"Оформить заказ",need:"Заполните все поля.",done:"Заказ принят!",num:"Номер",soon:"Администратор скоро свяжется с вами.",more:"Новый заказ",unit:{kg:"кг",l:"л",pc:"шт"},cats:{fv:"Овощи и фрукты",dairy:"Молочные",meat:"Мясо",basic:"Хлеб и крупы",drink:"Напитки"},som:"сом",min:"Бесплатная доставка от "+FREE_FROM+" сом"}
};
const P=[
 ["🍎","Алма","Яблоки","kg",120,40,"fv"],["🍌","Банан","Бананы","kg",150,25,"fv"],
 ["🥕","Сабиз","Морковь","kg",45,60,"fv"],["🍅","Помидор","Помидоры","kg",180,0,"fv"],
 ["🥔","Картошка","Картофель","kg",40,100,"fv"],["🥛","Сүт","Молоко","l",85,30,"dairy"],
 ["🧀","Быштак","Сыр","kg",450,12,"dairy"],["🥚","Жумуртка (10)","Яйца (10 шт)","pc",110,50,"dairy"],
 ["🍗","Тоок эти","Курица","kg",320,15,"meat"],["🥩","Уй эти","Говядина","kg",650,0,"meat"],
 ["🍞","Нан","Хлеб","pc",25,80,"basic"],["🍚","Күрүч","Рис","kg",95,40,"basic"],
 ["🧃","Ширин","Сок","l",130,20,"drink"],["💧","Суу 1.5 л","Вода 1.5 л","pc",40,90,"drink"]
].map((a,i)=>({id:i,e:a[0],ky:a[1],ru:a[2],u:a[3],p:a[4],s:a[5],c:a[6]}));
let lang="ky",cat="all",q="",cart={},done=null;
const $=id=>document.getElementById(id);
const t=()=>T[lang];
const fmt=n=>n.toLocaleString("ru-RU")+" "+t().som;
const sub=()=>Object.entries(cart).reduce((s,[id,n])=>s+P[id].p*n,0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const fee=()=>sub()>=FREE_FROM||sub()===0?0:FEE;

function renderStatic(){
 document.documentElement.lang=lang;
 $("lang").textContent=lang==="ky"?"RU":"КЫР";
 $("h1").textContent=t().h1;$("sub").textContent=t().sub+" "+t().min+".";
 $("q").placeholder=t().q;$("ct").textContent=t().cart;
 const cs=["all",...Object.keys(t().cats)];
 $("chips").innerHTML=cs.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c==="all"?t().all:t().cats[c]}</button>`).join("");
}
function renderGrid(){
 const list=P.filter(p=>(cat==="all"||p.c===cat)&&p[lang].toLowerCase().includes(q.toLowerCase()));
 $("grid").innerHTML=list.map(p=>{
  const n=cart[p.id]||0,out=p.s===0;
  return `<div class="p"><div class="e" aria-hidden="true">${p.e}</div><h3>${p[lang]}</h3>
  <div class="price">${fmt(p.p)} <small>/ ${t().unit[p.u]}</small></div>
  <div class="st ${out?"no":""}">${out?t().out:t().inst+p.s+" "+t().unit[p.u]}</div>
  ${n?`<div class="qty"><button data-m="${p.id}" aria-label="−">−</button><b>${n}</b><button data-a="${p.id}" aria-label="+" ${n>=p.s?"disabled":""}>+</button></div>`
  :`<button class="add" data-a="${p.id}" ${out?"disabled":""}>${out?t().out:t().add}</button>`}</div>`}).join("")||`<div class="empty">—</div>`;
}
function renderCart(){
 $("open").textContent="🛒 "+count()+" · "+fmt(sub());
 if(done){
  $("cb").innerHTML=`<div class="ok"><div style="font-size:54px">✅</div><b>${t().done}</b><div>${t().num}: #${done.id}</div><p>${t().soon}</p><button class="pill" id="again">${t().more}</button></div>`;
  $("sum").innerHTML="";return;
 }
 const ids=Object.keys(cart);
 $("cb").innerHTML=ids.length?ids.map(id=>{const p=P[id],n=cart[id];
  return `<div class="row"><span style="font-size:28px">${p.e}</span><div class="n">${p[lang]}<small>${fmt(p.p)} × ${n} = ${fmt(p.p*n)}</small></div>
  <button class="pill" data-m="${id}" aria-label="−">−</button><b>${n}</b><button class="pill" data-a="${id}" aria-label="+" ${n>=p.s?"disabled":""}>+</button></div>`}).join("")
  +`<form id="f" novalidate><input name="n" placeholder="${t().name}" autocomplete="name"><input name="ph" type="tel" placeholder="${t().phone}" autocomplete="tel"><input name="ad" placeholder="${t().addr}" autocomplete="street-address">
  <div class="pay"><label><input type="radio" name="pay" value="cash" checked>💵 ${t().cash}</label><label><input type="radio" name="pay" value="card">💳 ${t().card}</label></div><div class="err" id="err"></div></form>`
  :`<div class="empty">${t().empty}</div>`;
 $("sum").innerHTML=ids.length?`<div><span>${t().items}</span><span>${fmt(sub())}</span></div><div><span>${t().deliv}</span><span>${fee()?fmt(fee()):t().free}</span></div><div class="tot"><span>${t().total}</span><span>${fmt(sub()+fee())}</span></div><button class="go" id="go" style="width:100%;margin-top:10px">${t().order}</button>`:"";
}
function render(){renderStatic();renderGrid();renderCart()}
function change(id,d){
 const p=P[id],n=Math.max(0,Math.min(p.s,(cart[id]||0)+d));
 if(n)cart[id]=n;else delete cart[id];
 renderGrid();renderCart();
}
function setCart(o){$("cart").classList.toggle("open",o);$("shade").classList.toggle("open",o)}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.a!==undefined)change(+b.dataset.a,1);
 else if(b.dataset.m!==undefined)change(+b.dataset.m,-1);
 else if(b.dataset.c){cat=b.dataset.c;renderStatic();renderGrid()}
 else if(b.id==="lang"){lang=lang==="ky"?"ru":"ky";render()}
 else if(b.id==="open")setCart(true);
 else if(b.id==="close")setCart(false);
 else if(b.id==="again"){done=null;renderCart()}
 else if(b.id==="go")submit();
});
$("shade").onclick=()=>setCart(false);
$("q").oninput=e=>{q=e.target.value;renderGrid()};
async function submit(){
 const f=$("f"),d=new FormData(f),n=d.get("n").trim(),ph=d.get("ph").trim(),ad=d.get("ad").trim();
 if(!n||ph.replace(/\D/g,"").length<9||!ad){$("err").textContent=t().need;return}
 const order={id:Date.now().toString().slice(-6),name:n,phone:ph,address:ad,pay:d.get("pay"),
  items:Object.entries(cart).map(([id,k])=>({name:P[id].ru,qty:k,unit:P[id].u,sum:P[id].p*k})),
  subtotal:sub(),delivery:fee(),total:sub()+fee()};
 if(WEBHOOK_URL){try{await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(order)})}catch(e){}}
 done=order;cart={};render();
}
render();
</script>
</body>
</html>
